<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD Background Remover - RembgHD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --dark-bg: #0b0f19; --card-bg: #111827; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--dark-bg); color: #fff; text-align: center; }
        
        header { padding: 30px 20px; }
        .logo { font-size: 36px; font-weight: 800; color: var(--gold); text-decoration: none; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        
        .upload-area {
            background: var(--card-bg);
            border: 2px dashed #1f2937;
            border-radius: 20px;
            padding: 40px 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: var(--gold); }
        
        .preview-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .img-box {
            background: #111;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            max-width: 400px;
            width: 100%;
        }
        .img-box img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto; }
        
        /* Checkered Background for Output PNG Preview */
        .transparent-bg {
            background-color: #1a1a1a !important;
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%) !important;
            background-size: 20px 20px !important;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px !important;
            border: 2px solid var(--gold) !important;
        }

        .status { margin-top: 20px; font-weight: 600; color: var(--gold); font-size: 18px; }
        
        .btn-download {
            background: var(--gold);
            color: #000;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">RembgHD</a>
    </header>

    <div class="container">
        <h2>Upload Image to Remove Background</h2>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px;">📂</div>
            <p>Click here to select an image (JPG, PNG)</p>
            <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="processImage(this.files[0])">
        </div>

        <div id="status" class="status"></div>

        <div class="preview-container" id="previewArea" style="display:none;">
            <div class="img-box">
                <h4 style="margin-top:0;">Original HD Image</h4>
                <img id="originalImg">
            </div>
            <div class="img-box">
                <h4 style="margin-top:0; color: var(--gold);">Background Removed (Preview)</h4>
                <div style="border-radius: 8px; overflow: hidden;">
                    <img id="outputImg" class="transparent-bg">
                </div>
                <a id="downloadBtn" class="btn-download" download="rembghd_output.png">Download HD PNG</a>
            </div>
        </div>
    </div>

    <script>
        async function processImage(file) {
            if (!file) return;
            
            const statusDiv = document.getElementById('status');
            const previewArea = document.getElementById('previewArea');
            const originalImg = document.getElementById('originalImg');
            const outputImg = document.getElementById('outputImg');
            const downloadBtn = document.getElementById('downloadBtn');

            originalImg.src = URL.createObjectURL(file);
            previewArea.style.display = 'flex';
            outputImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            statusDiv.innerText = "⏳ Processing HD Image... Please wait.";

            try {
                // HF RMBG Space Call
                const base64Data = await fileToBase64(file);
                
                const response = await fetch("https://briaai-rmbg-1-4.hf.space/api/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        data: [base64Data]
                    })
                });

                const result = await response.json();
                
                if (result && result.data && result.data[0]) {
                    outputImg.src = result.data[0];
                    downloadBtn.href = result.data[0];
                    outputImg.style.display = 'block';
                    downloadBtn.style.display = 'inline-block';
                    statusDiv.innerText = "✅ Background Removed Successfully!";
                } else {
                    throw new Error("Invalid Response");
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "❌ Processing failed. Please try again.";
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
