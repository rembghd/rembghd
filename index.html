<script>
    async function processImage(file) {
        if (!file) return;
        
        const statusDiv = document.getElementById('status');
        const previewArea = document.getElementById('previewArea');
        const originalImg = document.getElementById('originalImg');
        const outputImg = document.getElementById('outputImg');
        const downloadBtn = document.getElementById('downloadBtn');

        originalImg.src = URL.createObjectURL(file);
        previewArea.style.display = 'flex';
        outputImg.style.display = 'none';
        downloadBtn.style.display = 'none';
        statusDiv.innerText = "⏳ Processing HD Image... Please wait.";

        try {
            // Form Data for Open Processing API
            const formData = new FormData();
            formData.append("image_file", file);

            // Directly calling public background removal endpoint
            const response = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST",
                headers: {
                    // Alternative Public AI Proxy Endpoint
                    "X-Api-Key": "INSERT_FREE_KEY_HERE" 
                },
                body: formData
            });

            // Agar Remove.bg key nahi hai, toh Open HuggingFace Space API fallback:
            if (!response.ok) {
                // Fallback to HuggingFace Space Gradio Call (No Token Needed)
                const hfResponse = await fetch("https://briaai-rmbg-1-4.hf.space/api/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        data: [await fileToBase64(file)]
                    })
                });

                const resultJson = await hfResponse.json();
                if (resultJson.data && resultJson.data[0]) {
                    outputImg.src = resultJson.data[0];
                    downloadBtn.href = resultJson.data[0];
                } else {
                    throw new Error("Processing Failed");
                }
            } else {
                const blob = await response.blob();
                const resultUrl = URL.createObjectURL(blob);
                outputImg.src = resultUrl;
                downloadBtn.href = resultUrl;
            }

            outputImg.style.display = 'block';
            downloadBtn.style.display = 'inline-block';
            statusDiv.innerText = "✅ Background Removed Successfully!";
        } catch (error) {
            console.error(error);
            // Backup direct API Call
            runFallbackHF(file);
        }
    }

    // Base64 Converter Helper
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function runFallbackHF(file) {
        const statusDiv = document.getElementById('status');
        const outputImg = document.getElementById('outputImg');
        const downloadBtn = document.getElementById('downloadBtn');

        try {
            const response = await fetch("https://briaai-rmbg-1-4.hf.space/call/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data: [await fileToBase64(file)] })
            });

            const { event_id } = await response.json();
            const result = await fetch(`https://briaai-rmbg-1-4.hf.space/call/predict/${event_id}`);
            const text = await result.text();
            
            // Extract image url
            const match = text.match(/https?:\/\/[^\s"]+/);
            if (match) {
                outputImg.src = match[0];
                downloadBtn.href = match[0];
                outputImg.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                statusDiv.innerText = "✅ Background Removed Successfully!";
            } else {
                throw new Error();
            }
        } catch (e) {
            statusDiv.innerText = "❌ Connection busy. Please try uploading again in a few seconds.";
        }
    }
</script>
